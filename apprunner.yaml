version: 1.0
runtime: nodejs18

build:
  commands:
    pre-build:
      - npm install -g pnpm@9
      - pnpm install --frozen-lockfile
      - pnpm run typecheck:libs
    build:
      - pnpm --filter @workspace/api-server run build
  env:
    - name: NODE_ENV
      value: production

run:
  command: node --enable-source-maps artifacts/api-server/dist/index.mjs
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
