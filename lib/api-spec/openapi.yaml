      required:
        - id
        - name
        - email
        - role
        - status
        - joinDate

    Property:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [rent, sale, bnb, hotel, hostel]
        price:
          type: integer
        address:
          type: string
        beds:
          type: integer
        baths:
          type: integer
        sqft:
          type: integer
        guests:
          type: integer
          nullable: true
        image:
          type: string
        images:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        videoPosters:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
        isVerified:
          type: boolean
        tags:
          type: array
          items:
            type: string
        lat:
          type: string
          nullable: true
        lng:
          type: string
          nullable: true
        createdAt:
          type: string
        approvedAt:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        hourlyRate:
          type: integer
          nullable: true
        priceUnit:
          type: string
          nullable: true
        totalUnits:
          type: integer
          minimum: 1
