openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: INNDOS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: properties
    description: Property listings
  - name: listing-drafts
    description: Private cross-platform listing drafts
  - name: bookings
    description: Bookings
  - name: favorites
    description: Wishlist / favorites
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: admin
    description: Administrator operations
  - name: maps
    description: Authenticated map and directions operations
  - name: cms
    description: Website-only content management operations

paths:
  /maps/directions:
    get:
      operationId: getDirections
      tags: [maps]
      summary: Get driving or walking directions between coordinates
      security:
        - bearerAuth: []
      parameters:
        - name: origin
          in: query
          required: true
          description: Comma-separated latitude and longitude for the route origin.
          schema:
            type: string
            example: "-1.2921,36.8219"
        - name: destination
          in: query
          required: true
          description: Comma-separated latitude and longitude for the route destination.
          schema:
            type: string
            example: "-1.2864,36.8172"
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [driving, walking]
            default: driving
      responses:
        "200":
          description: Route and turn-by-turn directions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectionsRoute"
        "400":
          description: Invalid coordinates or travel mode
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many directions requests. Retry after the `Retry-After` response header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Directions are not configured for this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Directions provider unavailable or no route found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  /listing-drafts/current:
    get:
      operationId: getCurrentListingDraft
      tags: [listing-drafts]
      summary: Get the current user's private listing draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDraft"
        "404":
          description: No saved draft
    put:
      operationId: saveCurrentListingDraft
      tags: [listing-drafts]
      summary: Save or replace the current user's private listing draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveListingDraftInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDraft"
    delete:
      operationId: deleteCurrentListingDraft
      tags: [listing-drafts]
      summary: Delete the current user's private listing draft
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Draft deleted

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [rent, sale, bnb, hotel, hostel, rent-business, rent-godown, rent-stall, rent-shop, sale-apartment, sale-home, sale-land]
          description: Main category or a composite category such as rent-business or sale-land.
        - name: subtype
          in: query
          schema:
            type: string
          description: Normalized subcategory; legacy spaces and underscores are accepted.
        - name: search
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: minLat
          in: query
          schema:
            type: number
        - name: maxLat
          in: query
          schema:
            type: number
        - name: minLng
          in: query
          schema:
            type: number
        - name: maxLng
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/videos/process:
    post:
      operationId: processPropertyVideo
      tags: [properties]
      summary: Apply an explicit trim and optional presentation edits to a property video
      description: Produces the final MP4 for a source video. One edit may run per user at a time, with at most four edit starts per ten-minute window.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPropertyVideoInput"
      responses:
        "201":
          description: Processed final MP4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPropertyVideoResponse"
        "400":
          description: Invalid trim or source video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Source is not owned or the account plan cannot process videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: A video edit is already running or the per-user edit rate limit was exceeded. Retry after the integer seconds in the `Retry-After` response header.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /properties/featured:
    get:
      operationId: listFeaturedProperties
      tags: [properties]
      summary: List active featured properties
      responses:
        "200":
          description: Featured listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

  /properties/listers:
    get:
      operationId: searchListers
      tags: [properties]
      summary: Search paid listers by personal or brand name
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paid listers with public listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListerSearchResult"

  /properties/listers/{id}:
    get:
      operationId: getListerProfile
      tags: [properties]
      summary: Get a public paid-lister profile and verified available listings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lister profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListerProfile"

  /properties/{id}/feature:
    post:
      operationId: featureProperty
      tags: [properties]
      summary: Apply a monthly featured allocation to an eligible listing
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Listing featured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
    delete:
      operationId: unfeatureProperty
      tags: [properties]
      summary: Remove a listing from the featured feed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Listing unfeatured
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "403":
          description: Not the property owner
        "404":
          description: Not found
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /properties/{id}/availability:
    get:
      operationId: getPropertyAvailability
      tags: [properties]
      summary: Get booked date ranges for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of booked date ranges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookedRange"
        "404":
          description: Not found

  /properties/{id}/status:
    patch:
      operationId: updatePropertyStatus
      tags: [properties]
      summary: Deactivate, reactivate, or mark an eligible sale listing as sold
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyStatusActionInput"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}/management-calendar:
    get:
      operationId: getPropertyManagementCalendar
      tags: [properties]
      summary: Get a non-sale property's private management calendar and Link-Up history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private management calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyManagementCalendar"
    post:
      operationId: createPropertyManagementCalendarEntry
      tags: [properties]
      summary: Add a private owner date or note to a non-sale property
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyManagementCalendarEntryInput"
      responses:
        "201":
          description: Created private calendar entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyManagementCalendarEntry"

  /properties/{id}/management-calendar/{entryId}:
    delete:
      operationId: deletePropertyManagementCalendarEntry
      tags: [properties]
      summary: Delete an owner-entered private management calendar entry
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entry deleted

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      description: |
        Returns a short-lived presigned GCS URL for an authenticated upload.
        The server validates file metadata, account eligibility, request rate,
        and listing-video plan access before issuing the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
        '403':
          description: Account or subscription does not allow the upload.
        '413':
          description: File exceeds the allowed size.
        '415':
          description: File type is not supported.
        '429':
          description: Too many upload URL requests.
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: List current user's favorited properties
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorited properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add a property to favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Added to favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
        "409":
          description: Already in favorites

  /favorites/{propertyId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a property from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed from favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
        "404":
          description: Not in favorites

  /favorites/check/{propertyId}:
    get:
      operationId: checkFavorite
      tags: [favorites]
      summary: Check if a property is in favorites
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List current user's bookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/received:
    get:
      operationId: listReceivedBookings
      tags: [bookings]
      summary: List Link-Ups received on the current lister's properties
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Received Link-Ups with participant contact details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /bookings/{id}/cancel:
    patch:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /subscriptions/payments/{paymentId}:
    get:
      operationId: getSubscriptionPayment
      tags: [subscriptions]
      summary: Get the signed-in user's subscription payment status
      security:
        - bearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPayment"

  /admin/users/{id}/profile:
    get:
      operationId: getAdminUserProfile
      tags: [admin]
      summary: Get an administrator's selected user profile details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User subscription profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "404":
          description: User not found

  /cms/public/{slug}:
    get:
      operationId: getPublicCmsPage
      tags: [cms]
      summary: Get a published website page
      parameters:
        - name: slug
          in: path
          required: true
          description: Page slug without the leading slash, or home for the homepage
          schema:
            type: string
      responses:
        "200":
          description: Published website page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPublicPage"
        "404":
          description: No published CMS page

  /cms/preview/{slug}:
    get:
      operationId: getCmsPreview
      tags: [cms]
      summary: Get a developer-only preview of a website page draft
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Page slug without the leading slash, or home for the homepage
          schema:
            type: string
      responses:
        "200":
          description: Website page draft and its current published version for comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPreviewPage"
        "401":
          description: Authentication required
        "403":
          description: Developer access required
        "404":
          description: CMS page not found
    post:
      operationId: createCmsPreview
      tags: [cms]
      summary: Preview an unsaved website page draft
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Page slug without the leading slash, or home for the homepage
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CmsPreviewInput"
      responses:
        "200":
          description: Validated unsaved website page draft and its current published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPreviewPage"
        "400":
          description: Invalid CMS draft document
        "401":
          description: Authentication required
        "403":
          description: Developer access required
        "404":
          description: CMS page not found

  /cms/pages:
    get:
      operationId: listCmsPages
      tags: [cms]
      summary: List editable website pages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Website pages and their drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CmsPage"
        "403":
          description: Developer access required

  /cms/pages/{slug}:
    get:
      operationId: getCmsPage
      tags: [cms]
      summary: Get a website page draft
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Website page draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
    put:
      operationId: updateCmsPage
      tags: [cms]
      summary: Save a website page draft
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCmsPageInput"
      responses:
        "200":
          description: Updated website page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "400":
          description: Invalid page document
        "403":
          description: Developer access required

  /cms/pages/{slug}/publish:
    post:
      operationId: publishCmsPage
      tags: [cms]
      summary: Publish a website page draft
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published website page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "409":
          description: The current draft has not been previewed and explicitly reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPreviewRequiredError"
        "403":
          description: Developer access required

  /cms/pages/{slug}/unpublish:
    post:
      operationId: unpublishCmsPage
      tags: [cms]
      summary: Remove the published website page and restore its legacy page
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Website page with publishing removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"

  /cms/pages/{slug}/restore:
    post:
      operationId: restoreCmsPage
      tags: [cms]
      summary: Restore the website page version that was live before the last publish
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Website page restored to its previous published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CmsPage"
        "409":
          description: No previous published version is available to restore
        "403":
          description: Developer access required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DirectionsRoute:
      type: object
      properties:
        polyline:
          type: string
          description: Google encoded overview polyline.
        distance:
          type: string
        duration:
          type: string
        startAddress:
          type: string
        endAddress:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DirectionsStep"
      required: [polyline, distance, duration, startAddress, endAddress, steps]
    DirectionsStep:
      type: object
      properties:
        instruction:
          type: string
        distance:
          type: string
        duration:
          type: string
        end:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Coordinate"
      required: [instruction, distance, duration, end]
    Coordinate:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
      required: [latitude, longitude]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AdminUserProfile:
      type: object
      properties:
        userId:
          type: string
