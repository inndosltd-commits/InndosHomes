          type: string
          enum: [free, basic, pro, enterprise]
        status:
          type: string
          enum: [active, expired, cancelled]
        billingCycle:
          type: [string, "null"]
          enum: [monthly, yearly, custom, null]
        billingMonths:
          type: [integer, "null"]
        startDate:
          type: [string, "null"]
        endDate:
          type: [string, "null"]
      required:
        - plan
        - status

    SignupInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [owner, tenant, admin, host, guest]
      required:
        - name
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
