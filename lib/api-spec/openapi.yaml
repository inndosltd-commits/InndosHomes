openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: INNDOS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: properties
    description: Property listings
  - name: listing-drafts
    description: Private cross-platform listing drafts
  - name: bookings
    description: Bookings
  - name: favorites
    description: Wishlist / favorites
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  /listing-drafts/current:
    get:
      operationId: getCurrentListingDraft
      tags: [listing-drafts]
      summary: Get the current user's private listing draft
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDraft"
        "404":
          description: No saved draft
    put:
      operationId: saveCurrentListingDraft
      tags: [listing-drafts]
      summary: Save or replace the current user's private listing draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveListingDraftInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingDraft"
    delete:
      operationId: deleteCurrentListingDraft
      tags: [listing-drafts]
      summary: Delete the current user's private listing draft
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Draft deleted

  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [rent, sale, bnb, hotel, hostel]
        - name: search
          in: query
          schema:
            type: string
        - name: ownerId
          in: query
          schema:
            type: string
        - name: minLat
          in: query
          schema:
            type: number
        - name: maxLat
          in: query
          schema:
            type: number
        - name: minLng
          in: query
          schema:
            type: number
        - name: maxLng
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyInput"
      responses:
        "201":
          description: Property created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/featured:
    get:
      operationId: listFeaturedProperties
      tags: [properties]
      summary: List active featured properties
      responses:
        "200":
          description: Featured listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"

  /properties/listers:
    get:
      operationId: searchListers
      tags: [properties]
      summary: Search paid listers by personal or brand name
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paid listers with public listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListerSearchResult"

  /properties/listers/{id}:
    get:
      operationId: getListerProfile
      tags: [properties]
      summary: Get a public paid-lister profile and verified available listings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lister profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListerProfile"

  /properties/{id}/feature:
    post:
      operationId: featureProperty
      tags: [properties]
      summary: Apply a monthly featured allocation to an eligible listing
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Listing featured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Property" }
    delete:
      operationId: unfeatureProperty
      tags: [properties]
      summary: Remove a listing from the featured feed
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Listing unfeatured
  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a property by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  /properties/{id}/availability:
    get:
      operationId: getPropertyAvailability
      tags: [properties]
      summary: Get booked date ranges for a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of booked date ranges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookedRange"
        "404":
          description: Not found

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      description: |
        Returns a short-lived presigned GCS URL for an authenticated upload.
        The server validates file metadata, account eligibility, request rate,
        and listing-video plan access before issuing the URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
        '403':
          description: Account or subscription does not allow the upload.
        '413':
          description: File exceeds the allowed size.
        '415':
          description: File type is not supported.
        '429':
          description: Too many upload URL requests.
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: List current user's favorited properties
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorited properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add a property to favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Added to favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
        "409":
          description: Already in favorites

  /favorites/{propertyId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a property from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed from favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"
        "404":
          description: Not in favorites

  /favorites/check/{propertyId}:
    get:
      operationId: checkFavorite
      tags: [favorites]
      summary: Check if a property is in favorites
      security:
        - bearerAuth: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List current user's bookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/cancel:
    patch:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SignupInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [owner, tenant, admin, host, guest]
      required:
        - name
        - email
        - password

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, tenant, admin, host, guest]
        status:
          type: string
          enum: [active, pending, suspended]
        joinDate:
          type: string
        avatar:
          type: string
          nullable: true
      required:
        - id
        - name
        - email
        - role
        - status
        - joinDate

    Property:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [rent, sale, bnb, hotel, hostel]
        price:
          type: integer
        address:
          type: string
        beds:
          type: integer
        baths:
          type: integer
        sqft:
          type: integer
        guests:
          type: integer
          nullable: true
        image:
          type: string
        images:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
        isVerified:
          type: boolean
        tags:
          type: array
          items:
            type: string
        lat:
          type: string
          nullable: true
        lng:
          type: string
          nullable: true
        createdAt:
          type: string
        description:
          type: string
          nullable: true
        subtype:
          type: string
          nullable: true
        hourlyRate:
          type: integer
          nullable: true
        priceUnit:
          type: string
          nullable: true
        totalUnits:
          type: integer
          minimum: 1
        propertyStatus:
          type: string
          enum: [pending, approved, flagged, sold]
        activeBookingsCount:
          type: integer
        ownerPhone:
          type: string
          nullable: true
        ownerEmail:
          type: string
          nullable: true
        ownerAvatar:
          type: string
          nullable: true
        ownerBusinessName:
          type: string
          nullable: true
        savedAt:
          type: string
          nullable: true
        ownerName:
          type: string
          nullable: true
        isFeatured:
          type: boolean
        featuredUntil:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - ownerId
        - title
        - type
        - price
        - address
        - beds
        - baths
        - sqft
        - image
        - images
        - videos
        - details
        - isVerified
        - tags
        - totalUnits

    CreatePropertyInput:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [rent, sale, bnb, hotel, hostel]
        price:
          type: integer
        address:
          type: string
        beds:
          type: integer
        baths:
          type: integer
        sqft:
          type: integer
        guests:
          type: integer
        image:
          type: string
        images:
          type: array
          items:
            type: string
        videos:
          type: array
          items:
            type: string
        details:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true
        lat:
          type: string
        lng:
          type: string
        subtype:
          type: string
        hourlyRate:
          type: integer
        priceUnit:
          type: string
        totalUnits:
          type: integer
          minimum: 1
      required:
        - title
        - type
        - price
        - address

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    ListingDraft:
      type: object
      required: [id, userId, data, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveListingDraftInput:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    ListerSearchResult:
      type: object
      required: [id, name, propertyCount]
      properties:
        id: { type: string }
        name: { type: string }
        avatar: { type: string, nullable: true }
        businessName: { type: string, nullable: true }
        plan: { type: string }
        propertyCount: { type: integer }
    ListerProfile:
      type: object
      required: [lister, properties]
      properties:
        lister:
          $ref: "#/components/schemas/ListerSearchResult"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Booking:
      type: object
      properties:
        id:
          type: string
        propertyId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        startDate:
          type: string
        endDate:
          type: string
        totalPrice:
          type: integer
        createdAt:
          type: string
        propertyTitle:
          type: string
          nullable: true
        propertyAddress:
          type: string
          nullable: true
        propertyImage:
          type: string
          nullable: true
        propertyImages:
          type: array
          items:
            type: string
          nullable: true
        propertyType:
          type: string
          nullable: true
      required:
        - id
        - propertyId
        - userId
        - status
        - startDate
        - endDate
        - totalPrice

    FavoriteInput:
      type: object
      properties:
        propertyId:
          type: string
      required:
        - propertyId

    FavoriteStatus:
      type: object
      properties:
        isFavorited:
          type: boolean
        propertyId:
          type: string
      required:
        - isFavorited
        - propertyId

    BookedRange:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        status:
          type: string
          enum: [pending, confirmed, blocked]
      required:
        - startDate
        - endDate
        - status

    CreateBookingInput:
      type: object
      properties:
        propertyId:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        totalPrice:
          type: integer
      required:
        - propertyId
        - startDate
        - endDate
        - totalPrice
