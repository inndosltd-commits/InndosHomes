        ownerPhone:
          type: string
          nullable: true
        ownerEmail:
          type: string
          nullable: true
        ownerAvatar:
          type: string
          nullable: true
        ownerBusinessName:
          type: string
          nullable: true
        savedAt:
          type: string
          nullable: true
        ownerName:
          type: string
          nullable: true
        isFeatured:
